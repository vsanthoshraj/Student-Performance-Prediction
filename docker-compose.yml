services:
  nginx:
    image: nginx:1.25-alpine
    container_name: edusense_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: vsanthoshraj/student-performance-prediction:latest
    container_name: edusense_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=myuser
      - MYSQL_PASSWORD=mypassword
      - MYSQL_DATABASE=edusense_db
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: mysql:8.0
    container_name: edusense_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: edusense_db
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    command: >
      --performance_schema=OFF
      --innodb_buffer_pool_size=64M
      --max_connections=20
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
