version: '3.8'

services:
  web:
    build: .
    image: vsanthoshraj/student-performance-prediction:latest
    container_name: edusense_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=edusense_user
      - MYSQL_PASSWORD=edusense_pass
      - MYSQL_DATABASE=edusense_db
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: edusense_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: edusense_db
      MYSQL_USER: edusense_user
      MYSQL_PASSWORD: edusense_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
