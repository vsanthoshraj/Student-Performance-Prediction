<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — EduSense AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: radial-gradient(at 50% 30%, rgba(99, 102, 241, 0.12) 0%, rgba(248, 250, 252, 1) 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--border-radius-xl);
      border: 1px solid rgba(226, 232, 240, 0.8);
      box-shadow: var(--shadow-lg);
      padding: 48px 40px;
      text-align: center;
    }
    .login-logo {
      width: 54px;
      height: 54px;
      background: var(--color-accent-gradient);
      color: white;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 24px;
      box-shadow: var(--shadow-accent);
    }
    .login-title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .login-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    .demo-hint {
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">✦</div>
      <h1 class="login-title">EduSense</h1>
      <p class="login-subtitle">Academic Intelligence & Risk Analytics Platform</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div style="background:var(--color-risk-bg); color:var(--color-risk-hover); border:1px solid var(--color-risk-border); padding:12px; border-radius:var(--border-radius-md); font-size:13px; font-weight:600; margin-bottom:20px; text-align:left; display:flex; align-items:center; gap:8px;">
              <i data-lucide="alert-circle" style="width:16px; height:16px;"></i> {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group" style="text-align:left;">
          <label class="form-label" for="email">Username</label>
          <div class="input-wrapper">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="email" name="email" class="form-input" placeholder="admin" value="admin" required>
          </div>
        </div>

        <div class="form-group" style="text-align:left; margin-bottom:28px;">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" value="admin" required>
          </div>
        </div>

        <button type="submit" class="btn-apple btn-primary-apple" style="width:100%; padding:14px; font-size:16px;">
          Sign In to Workspace <i data-lucide="arrow-right" style="width:18px; height:18px;"></i>
        </button>
      </form>

      <div class="demo-hint">
        <i data-lucide="sparkles" style="width:13px; height:13px; color:var(--color-accent);"></i>
        Demonstration Mode • Default credentials pre-filled
      </div>
    </div>
  </div>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
