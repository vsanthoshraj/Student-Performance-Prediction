<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — EduSense</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, rgba(0, 113, 227, 0.08) 0%, rgba(245, 245, 247, 1) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: var(--border-radius-xl);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      padding: 44px 36px;
      text-align: center;
    }
    .login-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0071E3, #42A5F5);
      color: white;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0, 113, 227, 0.3);
    }
    .login-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .login-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--border-radius-md);
      border: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.9);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 4px var(--color-accent-bg);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: var(--border-radius-md);
      background: var(--color-accent);
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    .btn-submit:hover {
      background: var(--color-accent-hover);
      box-shadow: 0 6px 20px rgba(0, 113, 227, 0.3);
    }
    .demo-hint {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">✦</div>
      <h1 class="login-title">EduSense</h1>
      <p class="login-subtitle">Academic intelligence, simplified.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div style="background:var(--color-risk-bg); color:var(--color-risk); padding:10px; border-radius:8px; font-size:13px; margin-bottom:16px;">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
          <label class="form-label" for="email">Username</label>
          <input type="text" id="email" name="email" class="form-input" placeholder="admin" value="admin" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" value="admin" required>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <p class="demo-hint">Project Demo • Any valid credentials will sign in</p>
    </div>
  </div>
</body>
</html>
