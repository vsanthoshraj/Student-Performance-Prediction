server {
    listen 80;
    server_name localhost;

    # Maximum upload size for Excel files
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Respond 200 OK to GCP Load Balancer Health Checks (GoogleHC User-Agent or /)
    location / {
        if ($http_user_agent ~* "GoogleHC") {
            return 200 'OK';
        }

        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Dedicated health check endpoint for Load Balancers (GCP, AWS, K8s)
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Internal Nginx health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }
}
